[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spider_vtbasmr"
version = "0.1.0"
description = "Python project scaffold for spider_vtbasmr"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.53.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
